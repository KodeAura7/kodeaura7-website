<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Global, non-per-page tags. Per-page title/description/OG/Twitter/canonical tags
         are rendered server-side into <head> by SEO.jsx via react-helmet-async. -->
    <meta name="theme-color" content="#6366F1" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#6366F1" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to external resources (fonts, API) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Organization Schema (static; React enhances it with live branding data) -->
    <script type="application/ld+json" id="org-schema">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "KodeAura7",
      "url": "https://kodeaura7.in",
      "logo": "https://kodeaura7.in/og-image.png",
      "email": "info@kodeaura7.in",
      "sameAs": []
    }
    </script>

    <!-- WebSite Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "KodeAura7",
      "url": "https://kodeaura7.in"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
